name: Publish Windows release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version' }
      - run: npm ci
      - run: npm run format:check
      - run: node --test
      - run: npm run release:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish installer and update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "v$version" --target "$env:GITHUB_SHA" --title "Mamba $version" --generate-notes }
          gh release upload "v$version" dist/Mamba-Setup-*.exe dist/*.blockmap dist/latest.yml --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:linux -- --config.linux.maintainer="Mamba contributors" --config.extraMetadata.homepage="https://github.com/shall0e/Mamba"
      - name: Publish Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release upload "v$version" dist/*.AppImage dist/*.deb dist/latest-linux.yml --clobber
